version: "3.9"

services:
  scraper-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mtg-scraper-dev
    ports:
      - "5000:5000"
    volumes:
      - ./output:/app/output
    environment:
      - FLASK_DEBUG=1
    command: python -m mtg_scraper_ui.app    

  scraper-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mtg-scraper-prod
    ports:
      - "5000:5000"
    volumes:
      - ./output:/app/output
    environment:
      - FLASK_DEBUG=0
    command: gunicorn -b 0.0.0.0:5000 mtg_scraper_ui.app:app
